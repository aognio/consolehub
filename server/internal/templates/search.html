{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Global Stream Search</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">Search log lines across multi-tenant execution runs</p>
  </div>

  <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <input type="text" placeholder="Search line text..." class="px-3.5 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm outline-none">
      <select class="px-3.5 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm outline-none">
        <option value="">All Streams (stdout, stderr, log)</option>
        <option value="stdout">stdout</option>
        <option value="stderr">stderr</option>
        <option value="log">log</option>
      </select>
      <select class="px-3.5 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm outline-none">
        <option value="">All Hosts</option>
      </select>
      <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg transition">Search</button>
    </div>
  </div>
</div>
{{end}}
